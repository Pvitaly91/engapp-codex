name: Gramlyze Production Bundle

on:
  push:
    branches:
      - codex/gramlyze-production-build-2026-11-19
    paths:
      - .github/workflows/gramlyze-production-bundle.yml
      - tools/release/build-production-bundle.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gramlyze-production-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build portable production archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact accepted source
        uses: actions/checkout@v4
        with:
          ref: 2afd1ec1423c725610b6fcca20c13a62256c6801
          path: source
          persist-credentials: false

      - name: Check out packaging script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: builder
          sparse-checkout: tools/release
          persist-credentials: false

      - name: Set up production PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, intl, json, mbstring, openssl, pcre, pdo, pdo_mysql, session, tokenizer, xml, zip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify accepted source inputs
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "2afd1ec1423c725610b6fcca20c13a62256c6801"
          test ! -e .env
          node tools/diagnostics/verify-perf-release-inputs.cjs

      - name: Install production Composer dependencies
        working-directory: source
        env:
          COMPOSER_NO_INTERACTION: '1'
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --no-plugins --no-scripts
          composer check-platform-reqs --no-dev

      - name: Build production frontend
        working-directory: source
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- composer.lock package-lock.json

      - name: Package and verify extracted archive
        run: |
          python3 builder/tools/release/build-production-bundle.py \
            --source source --output "$RUNNER_TEMP/gramlyze-production-output"

      - name: Upload ready-to-transfer build
        uses: actions/upload-artifact@v4
        with:
          name: gramlyze-production-2afd1ec1423c
          path: |
            ${{ runner.temp }}/gramlyze-production-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

