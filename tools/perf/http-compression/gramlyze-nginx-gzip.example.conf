# PERF-27 FUTURE EXAMPLE ONLY — not a deployed configuration.
# Include in one already reviewed Gramlyze server {}, never at http {} scope.
# Requires ngx_http_gzip_module, public document root and verified public assets.
# Rebuild the finite list from the target release manifest before any deployment.
# Integrate with existing static locations if they own cache/authorization policy.
# Refuse activation if upstream, gzip_static, Brotli or CDN encoding is unresolved.

# Do not inherit broad gzip for the SPA/Laravel fallback or other dynamic locations.
gzip off;

location ~ "^/(?:build/assets/(?:app-C0PgywvM\.css|app-DNxiirP_\.js|catalog-public-CgUm4gux\.js|catalog-public-Cy8aaDRf\.css)|gramlyze-background(?:-cards)?\.svg)$" {
    # No PHP/FastCGI/proxy fallback on an allowed-looking missing asset.
    try_files $uri @gramlyze_perf27_asset_404;
    disable_symlinks on from=$document_root;
    error_page 403 = @gramlyze_perf27_asset_403;
    error_page 404 = @gramlyze_perf27_asset_404;

    # Negotiate in the native output filter; do not set Content-Encoding by hand.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_proxied off;
    gzip_vary on;

    # Keep the identity representation for byte-range requests.
    if ($http_range != "") {
        gzip off;
    }
}

# Nginx's gzip filter can encode 403/404 in a gzip-enabled location.
# Preserve status but keep these handler responses identity.
location @gramlyze_perf27_asset_403 {
    gzip off;
    return 403;
}

location @gramlyze_perf27_asset_404 {
    gzip off;
    return 404;
}

# Do not add text/html, broad .json/.xml, /storage or any dynamic location here.
# gzip_types does not exclude text/html at an enabled location. See the guide.
