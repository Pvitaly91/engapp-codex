# PERF-28 template. Render only after precompress verify succeeds.
# Include the rendered file INSIDE the verified gramlyze.loc VirtualHost.
# The rendered fragment uses existing mod_rewrite, mod_headers, mod_mime and
# mod_authz_core. It does not load modules, install handlers, or expose an Alias.
# The packed file tree is outside DocumentRoot and has no public URL namespace.
RewriteEngine On

# Explicitly stop missing static paths before a per-directory front controller.
@@STATIC_GUARDS@@

# Only the exact generated route/file pairs can enter the packed tree.
@@SELECT_GZIP@@

<Directory "@@PACKED_ROOT@@">
    AllowOverride None
    Options -Indexes -ExecCGI -MultiViews -FollowSymLinks
    Require all granted
    FileETag INode MTime Size
    <FilesMatch "\.gz$">
        AddEncoding gzip .gz
        SetHandler default-handler
    </FilesMatch>
    <FilesMatch "\.css\.gz$">
        ForceType text/css
    </FilesMatch>
    <FilesMatch "\.m?js\.gz$">
        ForceType text/javascript
    </FilesMatch>
    <FilesMatch "\.svg\.gz$">
        ForceType image/svg+xml
    </FilesMatch>
</Directory>

@@VARY@@
