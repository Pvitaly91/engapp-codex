# Include ONLY inside a verified Gramlyze virtual host. This file does not
# load modules, change application response headers, or select a handler.
# Requires Apache >= 2.4.58 with mod_deflate, mod_filter and mod_headers.
DeflateCompressionLevel 6
DeflateAlterETag AddSuffix

# The positive URL list is deliberate. Laravel HTML/JSON (including guest
# test pages), uploads, source maps and private downloads are not eligible.
<LocationMatch "^/(?:build/assets/[A-Za-z0-9_-]+\.(?:css|m?js)|js/(?:theory-search|theory-mixed-test|theory-menu|theory-course-progress|polyglot-course-progress|english-answer-variants|authored-practice-ui|m(?:39|40|41|43|44|45)-practice-ui)\.js|(?:engram-language-pattern|gramlyze-background(?:-cards)?|favicon)\.svg|robots\.txt)$">
    FilterDeclare GRAMLYZE_PUBLIC_GZIP CONTENT_SET
    # Apache can report a static file's MIME as HANDLER, not just
    # default-handler. Never allow CGI, PHP, proxy, or a rewritten index.php.
    FilterProvider GRAMLYZE_PUBLIC_GZIP DEFLATE "%{REQUEST_METHOD} in { 'GET', 'HEAD' } && %{HANDLER} =~ m#^(?:default-handler|text/(?:css|javascript|plain)|application/javascript|image/svg\+xml)$#i && %{REQUEST_FILENAME} =~ m#\.(?:css|m?js|svg|txt)$# && -f %{REQUEST_FILENAME} && -z req_novary('Range') && -z resp('Content-Encoding') && -z resp('Set-Cookie') && resp('Cache-Control') !~ m#(?:^|,)[ \t]*(?:private|no-store|no-transform)(?:[ \t]*[,=]|[ \t]*$)#i && resp('Content-Length') =~ m#^[0-9]+$# && resp('Content-Length') -ge 1024 && %{CONTENT_TYPE} =~ m#^(?:text/(?:css|javascript|plain)|application/javascript|image/svg\+xml)(?:[ \t]*;|$)#i && req_novary('Accept-Encoding') !~ m#(?:^|,)[ \t]*gzip[ \t]*;[ \t]*q[ \t]*=[ \t]*0(?:[.]0{0,3})?[ \t]*(?:[,;]|$)#i"
    FilterChain +GRAMLYZE_PUBLIC_GZIP

    # DEFLATE adds Vary while running, but 304 and bypassed representations
    # of an eligible static resource must also have the same cache key.
    Header merge Vary Accept-Encoding "expr=%{REQUEST_FILENAME} =~ m#\.(?:css|m?js|svg|txt)$# && filesize(%{REQUEST_FILENAME}) -ge 1024 && %{REQUEST_STATUS} -lt 400"
    Header always merge Vary Accept-Encoding "expr=%{REQUEST_FILENAME} =~ m#\.(?:css|m?js|svg|txt)$# && filesize(%{REQUEST_FILENAME}) -ge 1024 && %{REQUEST_STATUS} == '304'"
</LocationMatch>
