# Include only inside the existing gramlyze.loc HTTP and HTTPS VirtualHosts.
# No TCP listener: mod_fcgid owns and recycles the PHP workers.
FcgidInitialEnv PATH "C:/Program Files/xampp/php-8.5.10-nts-gramlyze;C:/Windows/System32;C:/Windows"
FcgidInitialEnv SystemRoot "C:/Windows"
FcgidInitialEnv SystemDrive "C:"
FcgidInitialEnv windir "C:/Windows"
FcgidInitialEnv TEMP "C:/Program Files/xampp/tmp"
FcgidInitialEnv TMP "C:/Program Files/xampp/tmp"
FcgidInitialEnv PHPRC "C:/Program Files/xampp/php-8.5.10-nts-gramlyze"
FcgidInitialEnv PHP_INI_SCAN_DIR "C:/Program Files/xampp/php-8.5.10-nts-gramlyze/conf.d"
FcgidInitialEnv PHP_FCGI_CHILDREN "0"
FcgidInitialEnv PHP_FCGI_MAX_REQUESTS "1000"
FcgidMaxProcessesPerClass 2
FcgidMinProcessesPerClass 0
FcgidMaxRequestsPerProcess 500
FcgidIdleTimeout 300
FcgidIOTimeout 120
FcgidBusyTimeout 120
FcgidMaxRequestInMem 1048576
FcgidMaxRequestLen 220200960
FcgidPassHeader Authorization

<Directory "D:/DEV/htdocs/gramlyze.loc/public">
    Options -Indexes +FollowSymLinks +ExecCGI
    AllowOverride All
    Require all granted
    # Apache removes the outer quotes; mod_fcgid then parses the quoted command.
    FcgidWrapper "\"C:/Program Files/xampp/php-8.5.10-nts-gramlyze/php-cgi.exe\"" .php
    <FilesMatch "^(?:index|restore|restoredb)\.php$">
        SetHandler fcgid-script
    </FilesMatch>
    <FilesMatch "^(?!(?:index|restore|restoredb)\.php$).*(?i:\.(?:php[0-9]?|phps|phtml|phar)(?:\.|$))">
        Require all denied
    </FilesMatch>
</Directory>

# A root filename allowlist must not enable an uploaded subdirectory/index.php.
# Uploaded .htaccess files cannot restore an executable handler.
<Directory "D:/DEV/htdocs/gramlyze.loc/public/*">
    AllowOverride None
    AllowOverrideList None
    Options -ExecCGI
    <FilesMatch "(?i)\.(?:php[0-9]?|phps|phtml|phar)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

# Defense at Apache level even while the temporary Laravel probe is enabled.
<LocationMatch "^/api/_local/m9-4-curl-tls/?$">
    Require ip 127.0.0.1 ::1
</LocationMatch>
